  <script>
    const tl = gsap.timeline({ paused: true });

    // two circles arrive apart, then meet as the logo; they touch at 0.70 s (back.out reaches the touching gap at 23% of 0.7 s), on the track's drop
    tl.fromTo("#lobe-you", { x: -150, opacity: 0, scale: 0.7 }, { x: -150, opacity: 1, scale: 1, duration: 0.4, ease: "expo.out" }, 0);
    tl.fromTo("#lobe-them", { x: 150, opacity: 0, scale: 0.7 }, { x: 150, opacity: 1, scale: 1, duration: 0.37, ease: "expo.out" }, 0.08);
    tl.to("#lobe-you", { x: 0, duration: 0.7, ease: "back.out(1.4)" }, 0.54);
    tl.to("#lobe-them", { x: 0, duration: 0.7, ease: "back.out(1.4)" }, 0.54);

    tl.fromTo("#wordmark", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power2.out" }, 1.1);
    gsap.utils.toArray("#tagline .w").forEach((w, i) => {
      tl.fromTo(w, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13 }, 1.4 + i * 0.07);
    });

    window.__timelines["payoff"] = tl;
