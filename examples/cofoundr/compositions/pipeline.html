  <style>

    /* scoring */

    /* match card */
    #card-match {

    #match-avatar {

    #match-title {
      position: absolute;

    #match-sub {

    #match-score b {

    #match-score span {

    #match-draft {

  </style>
  <div id="root" data-composition-id="pipeline" data-width="1080" data-height="1080">
    <div id="rail">
      <div id="rail-track"></div>
      <div id="rail-fill"></div>
      <div class="node" style="left: 180px"><div class="lit"></div></div>
      <div class="node" style="left: 413px"><div class="lit"></div></div>
      <div class="node" style="left: 647px"><div class="lit"></div></div>
      <div class="node" style="left: 880px"><div class="lit"></div></div>
      <div class="node-label" style="left: 180px">enrich you</div>
      <div class="node-label" style="left: 413px">search 700M</div>
      <div class="node-label" style="left: 647px">score 30</div>
      <div class="node-label" style="left: 880px">write intros</div>
    </div>

    <div id="card-in">
      <div class="label">your linkedin</div>
      <div id="url" data-var-text="profileUrl">linkedin.com/in/codeswithroh</div>
      <div id="need">need: technical co-founder</div>
    </div>

    <div id="field"></div>
    <div id="counter-a" class="counter"><b>700M</b><span>public profiles</span></div>
    <div id="counter-b" class="counter"><b>30</b><span>real candidates</span></div>

    <div id="weights">
      <span class="w">score</span> <span class="w">=</span>
      <span class="w"><strong>availability</strong> 40%</span>
      <span class="w">+</span> <span class="w"><strong>skill</strong> 35%</span>
      <span class="w">+</span> <span class="w"><strong>culture</strong> 25%</span>
    </div>
    <div id="bars-base"></div>
    <div id="bars"></div>

    <div id="card-match">
      <div id="match-avatar"></div>
      <div id="match-title">Founding Engineer</div>
      <div id="match-sub">Bengaluru · 2 startups</div>
      <div id="match-score"><b>9.1</b><span>/10</span></div>
      <div id="match-rule"></div>
      <div id="match-draft-label">intro draft</div>
      <div id="match-draft">saw your side projects. want to build something together? coffee friday?</div>
    </div>

    <div id="you"></div>
  </div>
  <script>
    // seeded so every render draws the same field and the same scores
    function mulberry32(a) {
      return function () {
        a |= 0;
        a = (a + 0x6d2b79f5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }
    const rand = mulberry32(42);

    const root = document.querySelector('[data-composition-id="pipeline"]');
    const field = root.querySelector("#field");
    const barsEl = root.querySelector("#bars");

    // URL typed letter by letter
    const urlEl = root.querySelector("#url");
    const urlText = urlEl.textContent;
    urlEl.innerHTML = [...urlText].map((c) => `<span>${c}</span>`).join("");

    // intro draft typed word by word
    const draftEl = root.querySelector("#match-draft");
    draftEl.innerHTML = draftEl.textContent
      .split(" ")
      .map((w) => `<span class="w">${w}</span>`)
      .join(" ");

    // field: 24 x 14 grid around "you" at (540, 530)
    const CX = 540;
    const CY = 530;
    const dots = [];
    for (let j = 0; j < 14; j++) {
      for (let i = 0; i < 24; i++) {
        const x = 80 + i * 40 + (rand() - 0.5) * 14;
        const y = 270 + j * 40 + (rand() - 0.5) * 14;
        const d = Math.hypot(x - CX, y - CY);
        if (d < 96) continue;
        const el = document.createElement("div");
        el.className = "dot";
        field.appendChild(el);
        dots.push({ el, x, y, d });
      }
    }
    // pick 30 candidates spread across the field
    const pool = dots.map((_, i) => i);
    for (let i = pool.length - 1; i > 0; i--) {
      const k = Math.floor(rand() * (i + 1));
      [pool[i], pool[k]] = [pool[k], pool[i]];
    }
    const litIdx = pool.slice(0, 30).sort((a, b) => dots[a].x - dots[b].x);
    const lit = new Set(litIdx);

    // scores: the top one is the 9.1 on the match card
    const scores = litIdx.map(() => 2.6 + rand() * 5.8);
    scores[17] = 9.1;
    const order = scores.map((s, i) => i).sort((a, b) => scores[b] - scores[a]);
    const rank = [];
    order.forEach((slot, r) => (rank[slot] = r));

    const BASE = 806;
    const slotX = (k) => 120 + k * 28;
    const bars = litIdx.map((di, k) => {
      const h = Math.round(scores[k] * 48);
      const el = document.createElement("div");
      el.className = "bar";
      el.style.height = h + "px";
      barsEl.appendChild(el);
      return { el, h, k };
    });

    const tl = gsap.timeline({ paused: true });
    // hold the need tag 0.6 s longer and the intro draft 1.4 s longer
    const at = (t) => t + (t >= 1.6 ? 0.6 : 0) + (t >= 8.0 ? 1.4 : 0);

    // ── input card (0 to 1.6) ─────────────────────────────
    tl.fromTo("#card-in", { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 0.6, ease: "expo.out" }, 0);
    tl.fromTo("#rail", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 0.25);
    tl.set("#rail-fill", { scaleX: 0 }, 0);
    urlEl.querySelectorAll("span").forEach((s, i) => tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, 0.3 + i * (2 / 60)));
    const lights = root.querySelectorAll(".node .lit");
    const labels = root.querySelectorAll(".node-label");
    const light = (n, t) => {
      tl.fromTo(lights[n], { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.out", immediateRender: n === 0 }, t);
      tl.fromTo(labels[n], { color: "#64748b" }, { color: "#0f172a", duration: 0.2, immediateRender: n === 0 }, t);
      if (n > 0) tl.fromTo("#rail-fill", { scaleX: (n - 1) / 3 }, { scaleX: n / 3, duration: 0.4, ease: "power2.inOut" }, t - 0.4);
    };
    light(0, 1.25);
    tl.fromTo("#need", { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.5, ease: "expo.out" }, 0.9);

    // ── search 700M (1.6 to 3.8) ──────────────────────────
    tl.to("#card-in", { opacity: 0, y: -40, filter: "blur(6px)", duration: 0.3, ease: "power3.in" }, at(1.6));
    tl.fromTo("#you", { x: 0, y: 0 }, { x: CX - 198, y: CY - 468, duration: 0.7, ease: "power3.inOut" }, at(1.6));
    light(1, at(1.95));
    dots.forEach((p) => {
      tl.fromTo(p.el, { x: CX, y: CY, opacity: 0 }, { x: p.x, y: p.y, opacity: 1, duration: 0.6, ease: "expo.out" }, at(1.95) + (p.d / 620) * 0.6);
    });
    tl.fromTo("#counter-a", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18 }, at(2.1));

    // all but 30 dim
    dots.forEach((p, i) => {
      if (lit.has(i)) tl.to(p.el, { backgroundColor: "#3b5bdb", scale: 1.5, duration: 0.3, ease: "power2.out" }, at(3.0) + (p.x / 1080) * 0.25);
      else tl.to(p.el, { opacity: 0.22, duration: 0.3, ease: "power2.out" }, at(3.0));
    });
    tl.to("#counter-a", { opacity: 0, filter: "blur(8px)", duration: 0.15, ease: "power3.in" }, at(3.0));
    tl.fromTo("#counter-b", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.15 }, at(3.13));

    // ── score 30 (3.8 to 6.2) ─────────────────────────────
    tl.to("#you", { opacity: 0, scale: 0.6, duration: 0.3, ease: "power3.in" }, at(3.8));
    tl.to("#counter-b", { opacity: 0, filter: "blur(8px)", duration: 0.2, ease: "power3.in" }, at(3.8));
    dots.forEach((p, i) => {
      if (!lit.has(i)) tl.to(p.el, { opacity: 0, duration: 0.25, ease: "power3.in" }, at(3.8));
    });
    litIdx.forEach((di, k) => {
      tl.to(dots[di].el, { x: slotX(k) + 11, y: BASE - 6, duration: 0.6, ease: "power3.inOut" }, at(3.8) + k * 0.006);
      tl.to(dots[di].el, { opacity: 0, duration: 0.1 }, at(4.45));
    });
    light(2, at(4.4));
    tl.fromTo("#bars-base", { opacity: 0 }, { opacity: 1, duration: 0.3 }, at(4.3));
    root.querySelectorAll("#weights .w").forEach((w, i) => {
      tl.fromTo(w, { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13 }, at(4.35) + i * 0.07);
    });
    bars.forEach((b) => {
      tl.fromTo(b.el, { x: slotX(b.k), y: BASE - b.h, scaleY: 0 }, { scaleY: 1, duration: 0.5, ease: "expo.out" }, at(4.42) + b.k * 0.01);
      tl.to(b.el, { x: slotX(rank[b.k]), duration: 0.8, ease: "power3.inOut" }, at(5.0) + rank[b.k] * 0.006);
      if (rank[b.k] >= 10) tl.to(b.el, { backgroundColor: "#c7cde0", duration: 0.25 }, at(5.75));
    });

    // ── write intros (6.2 to 8.4) ─────────────────────────
    bars.forEach((b) => {
      if (rank[b.k] >= 10) tl.to(b.el, { y: `+=40`, opacity: 0, duration: 0.3, ease: "power3.in" }, at(6.2));
      else tl.to(b.el, { x: 540 - 11, scaleY: 0.2, opacity: 0, duration: 0.45, ease: "power3.in" }, at(6.25) + rank[b.k] * 0.01);
    });
    tl.to(["#weights", "#bars-base"], { opacity: 0, filter: "blur(8px)", duration: 0.2, ease: "power3.in" }, at(6.2));
    light(3, at(6.4));
    tl.fromTo("#card-match", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.6, ease: "expo.out" }, at(6.45));
    draftEl.querySelectorAll(".w").forEach((w, i) => tl.fromTo(w, { opacity: 0 }, { opacity: 1, duration: 0.04 }, at(6.85) + i * 0.05));

    // blur swap into the payoff
    tl.to(["#card-match", "#rail"], { opacity: 0, filter: "blur(8px)", duration: 0.2, ease: "power3.in" }, at(8.18));

    window.__timelines["pipeline"] = tl;
  </script>
</template>
