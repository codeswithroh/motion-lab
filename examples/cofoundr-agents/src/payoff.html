  <script>
    const tl = gsap.timeline({ paused: true });

    // circles arrive apart, then meet as the logo. With back.out(1.4) over 0.7 s they touch 0.161 s after the
    // move starts (73% of the travel), so the move starts at 0.919: touch at 1.080 s = film 14.780 s; the track's
    // hit measures at 14.790 s in the render.
    tl.fromTo("#lobe-you", { x: -187.5, opacity: 0, scale: 0.7 }, { x: -187.5, opacity: 1, scale: 1, duration: 0.4, ease: "expo.out" }, 0);
    tl.fromTo("#lobe-them", { x: 187.5, opacity: 0, scale: 0.7 }, { x: 187.5, opacity: 1, scale: 1, duration: 0.37, ease: "expo.out" }, 0.08);
    tl.to("#lobe-you", { x: 0, duration: 0.7, ease: "back.out(1.4)" }, 0.919);
    tl.to("#lobe-them", { x: 0, duration: 0.7, ease: "back.out(1.4)" }, 0.919);

    // shockwave on the hit
    tl.fromTo("#ring-a", { scale: 1, opacity: 1 }, { scale: 3.4, opacity: 0, duration: 0.9, ease: "power2.out", immediateRender: false }, 1.08);
    tl.fromTo("#ring-b", { scale: 1, opacity: 0.6 }, { scale: 2.4, opacity: 0, duration: 0.9, ease: "power2.out", immediateRender: false }, 1.16);

    tl.fromTo("#wordmark", { opacity: 0, filter: "blur(8px)", y: 20 }, { opacity: 1, filter: "blur(0px)", y: 0, duration: 0.3, ease: "expo.out" }, 1.3);
    gsap.utils.toArray("#tagline .w").forEach((w, i) => {
      tl.fromTo(w, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13 }, 1.55 + i * 0.08);
    });
    gsap.utils.toArray("#apps .tile").forEach((t, i) => {
      tl.fromTo(t, { opacity: 0, y: 14, rotation: -8 }, { opacity: 1, y: 0, rotation: 0, duration: 0.5, ease: "expo.out" }, 1.95 + i * 0.06);
    });
    tl.fromTo("#url", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 1.75);

    window.__timelines["payoff"] = tl;
  </script>
