        <div class="tile" data-app="claude" style="background:#d97757;"><svg viewBox="0 0 24 24" fill="#fff" fill-rule="evenodd"><path d="M4.709 15.955l4.72-2.647.08-.23-.08-.128H9.2l-.79-.048-2.698-.073-2.339-.097-2.266-.122-.571-.121L0 11.784l.055-.352.48-.321.686.06 1.52.103 2.278.158 1.652.097 2.449.255h.389l.055-.157-.134-.098-.103-.097-2.358-1.596-2.552-1.688-1.336-.972-.724-.491-.364-.462-.158-1.008.656-.722.881.06.225.061.893.686 1.908 1.476 2.491 1.833.365.304.145-.103.019-.073-.164-.274-1.355-2.446-1.446-2.49-.644-1.032-.17-.619a2.97 2.97 0 01-.104-.729L6.283.134 6.696 0l.996.134.42.364.62 1.414 1.002 2.229 1.555 3.03.456.898.243.832.091.255h.158V9.01l.128-1.706.237-2.095.23-2.695.08-.76.376-.91.747-.492.584.28.48.685-.067.444-.286 1.851-.559 2.903-.364 1.942h.212l.243-.242.985-1.306 1.652-2.064.73-.82.85-.904.547-.431h1.033l.76 1.129-.34 1.166-1.064 1.347-.881 1.142-1.264 1.7-.79 1.36.073.11.188-.02 2.856-.606 1.543-.28 1.841-.315.833.388.091.395-.328.807-1.969.486-2.309.462-3.439.813-.042.03.049.061 1.549.146.662.036h1.622l3.02.225.79.522.474.638-.079.485-1.215.62-1.64-.389-3.829-.91-1.312-.329h-.182v.11l1.093 1.068 2.006 1.81 2.509 2.33.127.578-.322.455-.34-.049-2.205-1.657-.851-.747-1.926-1.62h-.128v.17l.444.649 2.345 3.521.122 1.08-.17.353-.608.213-.668-.122-1.374-1.925-1.415-2.167-1.143-1.943-.14.08-.674 7.254-.316.37-.729.28-.607-.461-.322-.747.322-1.476.389-1.924.315-1.53.286-1.9.17-.632-.012-.042-.14.018-1.434 1.967-2.18 2.945-1.726 1.845-.414.164-.717-.37.067-.662.401-.589 2.388-3.036 1.44-1.882.93-1.086-.006-.158h-.055L4.132 18.56l-1.13.146-.487-.456.061-.746.231-.243 1.908-1.312-.006.006z"></path></svg></div>
        <div id="reply-title" class="serif">10 matches in 12 s</div>
      </div>
      <div class="row" style="top: 400px; width: 927px; background: #3b5bdb">
        <div class="rank serif">1</div>
        <div class="role">Founding engineer</div><div class="sub">fintech · Bengaluru</div>
        <div class="score serif">9.9</div>
      </div>
      <div class="row" style="top: 544px; width: 889px; background: #5b63d6">
        <div class="rank serif">2</div>
        <div class="role">CTO, payments startup</div><div class="sub">Mumbai</div>
        <div class="score serif">9.5</div>
      </div>
      <div class="row" style="top: 688px; width: 889px; background: #5b63d6">
        <div class="rank serif">3</div>
        <div class="role">Staff engineer, ex-founder</div><div class="sub">remote</div>
        <div class="score serif">9.5</div>
      </div>
    </div>

    <div id="you"></div>
  </div>
  <script>
    // seeded so every render draws the same field
    function mulberry32(a) {
      return function () {
        a |= 0;
        a = (a + 0x6d2b79f5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }
    const rand = mulberry32(7);
    const root = document.querySelector('[data-composition-id="agents"]');
    const $ = (s) => root.querySelector(s);
    const $$ = (s) => [...root.querySelectorAll(s)];

    // message typed letter by letter, wrapping between words
    const msgEl = $("#msg");
    msgEl.innerHTML = msgEl.textContent
      .split(" ")
      .map((w) => `<span class="word">${[...w].map((c) => `<span class="ch">${c}</span>`).join("")}</span>`)
      .join(" ");

    // "you" lives at the connect screen's left box: centre 302,390. Moves are offsets from there.
    const YX = 302;
    const YY = 390;
    const toYou = (x, y, size) => ({ x: x - YX, y: y - YY, scale: size / 96 });

    // 700M field: a grid of squares around the centre
    const CX = 540;
    const CY = 445;
    const sqs = [];
    for (let j = 0; j < 18; j++) {
      for (let i = 0; i < 31; i++) {
        const x = 90 + i * 30;
        const y = 190 + j * 30;
        const d = Math.hypot(x - CX, y - CY);
        if (d < 80) continue;
        const el = document.createElement("div");
        el.className = "sq";
        $("#field").appendChild(el);
        sqs.push({ el, x, y, d });
      }
    }
    const pool = sqs.map((_, i) => i);
    for (let i = pool.length - 1; i > 0; i--) {
      const k = Math.floor(rand() * (i + 1));
      [pool[i], pool[k]] = [pool[k], pool[i]];
    }
    const lit30 = new Set(pool.slice(0, 30));
    const top10 = new Set(pool.slice(0, 10));

    const tl = gsap.timeline({ paused: true });
    // +0.5 s on the "10 ranked" counter, +0.3 s on the result rows (same cue sheet as v1)
    const at = (t) => t + (t >= 8.3 ? 0.5 : 0) + (t >= 10 ? 0.3 : 0);

    const blurIn = (els, t, gap = 0.07) =>
      els.forEach((w, i) => tl.fromTo(w, { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13 }, t + i * gap));
    const blurOut = (els, t) => tl.to(els, { opacity: 0, filter: "blur(8px)", duration: 0.25, ease: "power3.in" }, t);

    const fills = $$(".chap .fill");
    const chapText = $$(".chap .t");
    tl.set(fills, { scaleX: 0 }, 0);
    const light = (n, t) => {
      tl.fromTo(fills[n], { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power2.inOut", immediateRender: false }, t - 0.2);
      tl.fromTo(chapText[n], { color: "#6b6558" }, { color: "#111111", duration: 0.2, immediateRender: n === 0 }, t);
    };

    // ── connect (0 to 3.0) ───────────────────────────────
    tl.set("#you", toYou(302, 390, 180), 0);
    tl.fromTo("#consent", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 0);
    tl.fromTo("#you-box", { clipPath: "inset(0 0 100% 0)" }, { clipPath: "inset(0 0 0% 0)", duration: 0.6, ease: "expo.out" }, 0);
    tl.fromTo("#swap", { scale: 0 }, { scale: 1, duration: 0.5, ease: "expo.out" }, 0.15);
    tl.fromTo("#rail", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 0.2);
    blurIn($$("#pick .w"), at(0.08));
    // the right half floods with each app's own colour: ChatGPT, Cursor, VS Code, Claude Code, then Claude
    const floods = $$("#slot .flood");
    floods.forEach((el, i) => {
      const t = at(0.3) + i * 0.18;
      tl.fromTo(el, { clipPath: "inset(100% 0 0 0)" }, { clipPath: "inset(0% 0 0 0)", duration: 0.16, ease: "expo.out" }, t);
      tl.fromTo(el.querySelector(".logo"), { scale: 0.7 }, { scale: 1, duration: 0.2, ease: "expo.out" }, t);
    });
    blurOut($$("#pick .w"), at(1.05));
    blurIn($$("#connect-title .w"), at(1.3));
    $$(".perm").forEach((p, i) => {
      tl.fromTo(p, { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.5, ease: "expo.out" }, at(1.45) + i * 0.08);
    });
    $$(".perm .on").forEach((on, i) => {
      tl.fromTo(on, { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.25, ease: "expo.out" }, at(1.85) + i * 0.15);
    });
    tl.fromTo("#cap", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, at(2.1));
    tl.fromTo("#cap .fill", { opacity: 0 }, { opacity: 1, duration: 0.15 }, at(2.35));
    tl.fromTo("#allow", { opacity: 0, x: 24 }, { opacity: 1, x: 0, duration: 0.4, ease: "expo.out" }, at(2.3));
    tl.to("#allow", { scale: 0.96, duration: 0.08, ease: "power2.in" }, at(2.72));
    tl.to("#allow", { scale: 1, backgroundColor: "#3b5bdb", duration: 0.2, ease: "power2.out" }, at(2.8));
    light(0, at(2.8));

    // ── ask (3.0 to 5.4) ─────────────────────────────────
    tl.to("#consent", { opacity: 0, y: -40, filter: "blur(6px)", duration: 0.3, ease: "power3.in" }, at(3.0));
    tl.fromTo("#chat", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, at(3.15));
    tl.fromTo(".chat-head", { y: 20 }, { y: 0, duration: 0.6, ease: "expo.out" }, at(3.15));
    tl.to("#you", { ...toYou(108, 360, 72), duration: 0.7, ease: "power3.inOut" }, at(3.0));
    light(1, at(3.4));
    $$("#msg .ch").forEach((s, i) => tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, at(3.45) + i * (2 / 60)));
    // the tool call sweeps in as a black band
    tl.fromTo("#tool", { x: -1080 }, { x: 0, duration: 0.45, ease: "expo.out" }, at(4.42));

    // ── search 700M (5.4 to 8.3) ─────────────────────────
    tl.to("#chat", { opacity: 0, y: -40, filter: "blur(6px)", duration: 0.3, ease: "power3.in" }, at(5.4));
    tl.to("#you", { ...toYou(CX, CY, 96), duration: 0.7, ease: "power3.inOut" }, at(5.4));
    light(2, at(5.75));
    sqs.forEach((p) => {
      tl.fromTo(p.el, { x: CX, y: CY, opacity: 0 }, { x: p.x, y: p.y, opacity: 0.85, duration: 0.6, ease: "expo.out" }, at(5.75) + (p.d / 620) * 0.6);
    });
    tl.fromTo("#counter-a", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18 }, at(5.9));
    // 30 scored stay ink, the rest fade into the paper
    sqs.forEach((p, i) => {
      if (lit30.has(i)) tl.to(p.el, { opacity: 1, scale: 1.7, duration: 0.3, ease: "power2.out" }, at(6.7) + (p.x / 1080) * 0.25);
      else tl.to(p.el, { opacity: 0.1, duration: 0.3, ease: "power2.out" }, at(6.7));
    });
    tl.to("#counter-a", { opacity: 0, filter: "blur(8px)", duration: 0.15, ease: "power3.in" }, at(6.7));
    tl.fromTo("#counter-b", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.15 }, at(6.83));
    // the 10 ranked turn into blue diamonds
    sqs.forEach((p, i) => {
      if (top10.has(i)) tl.to(p.el, { backgroundColor: "#3b5bdb", rotation: 45, scale: 2.8, duration: 0.3, ease: "power2.out" }, at(7.4) + (p.x / 1080) * 0.2);
      else if (lit30.has(i)) tl.to(p.el, { opacity: 0.25, scale: 1, duration: 0.3, ease: "power2.out" }, at(7.4));
    });
    tl.to("#counter-b", { opacity: 0, filter: "blur(8px)", duration: 0.15, ease: "power3.in" }, at(7.4));
    tl.fromTo("#counter-c", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.15 }, at(7.53));

    // ── 10 in chat (8.3 to 10.4) ─────────────────────────
    sqs.forEach((p, i) => {
      // the 10 ranked fly to where the score bars grow from
      if (top10.has(i)) tl.to(p.el, { x: 100, y: 464 + (i % 3) * 144, opacity: 0, scale: 1.4, duration: 0.3, ease: "power3.in" }, at(8.3));
      else tl.to(p.el, { opacity: 0, duration: 0.25, ease: "power3.in" }, at(8.3));
    });
    tl.to("#counter-c", { opacity: 0, filter: "blur(8px)", duration: 0.2, ease: "power3.in" }, at(8.3));
    // you: centre -> the question line's avatar (centre 100,196, 48 px)
    tl.to("#you", { ...toYou(100, 196, 48), duration: 0.5, ease: "power3.inOut" }, at(8.3));
    tl.fromTo("#reply", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, at(8.55));
    // the title waits for "you" to land on the question line
    tl.fromTo("#reply .chat-head", { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "expo.out", immediateRender: false }, at(8.8));
    light(3, at(8.7));
    // score bars grow from the left, length = score
    $$(".row").forEach((r, i) => {
      tl.fromTo(r, { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.5, ease: "expo.out" }, at(8.9) + i * 0.12);
    });

    // blur swap into the payoff
    tl.to(["#reply", "#rail", "#you"], { opacity: 0, filter: "blur(8px)", duration: 0.2, ease: "power3.in" }, at(10.18));

    window.__timelines["agents"] = tl;
  </script>
</template>
