  </style>
  <div id="root" data-composition-id="hook" data-width="1080" data-height="1080">
    <div id="hook-you"></div>
    <div id="hook-line">
      <span class="w">now</span> <span class="w">i</span> <span class="w">just</span><br />

  <script>
    const tl = gsap.timeline({ paused: true });
    const words = gsap.utils.toArray("#hook-line .w");

    // f0 is the thumbnail: the line is already landed; the disc rises into place behind it
    tl.set(words, { opacity: 1 }, 0);
    tl.fromTo("#hook-you", { y: 120, scale: 0.9 }, { y: 0, scale: 1, duration: 0.6, ease: "expo.out" }, 0);
    tl.fromTo("#hook-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "expo.out" }, 0.1);

    // exit: words blur out; the disc carries into the connect screen's "you" spot (centre 302,390, 180 px)
    words.forEach((w, i) => {
      tl.to(w, { opacity: 0, filter: "blur(8px)", duration: 0.18, ease: "power3.in" }, 1.95 + i * 0.03);
    });
    tl.to(["#hook-rule", "#hook-tag"], { opacity: 0, duration: 0.18, ease: "power3.in" }, 1.95);
    tl.to("#hook-you", { x: 302 - 980, y: 390 - 850, scale: 180 / 760, duration: 0.55, ease: "power3.inOut", immediateRender: false }, 1.95);

    window.__timelines["hook"] = tl;
